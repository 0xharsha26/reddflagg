<!DOCTYPE html>
<html>
<head>
  <title>REDDFLAGG</title>

  <style>
    body {
      width: 320px;
      background: #0b0b0f;
      color: white;
      font-family: Arial;
      padding: 18px;
    }

    h2 {
      color: #ff2b2b;
      margin-top: 0;
    }

    button {
      width: 100%;
      background: #ff2b2b;
      border: none;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      background: #15151c;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
    }

    .high {
      color: #ff2b2b;
    }

    .suspicious {
      color: #ffb020;
    }

    .low {
      color: #38d66b;
    }

    .label {
      color: #aaa;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <h2>REDDFLAGG</h2>

  <button id="scanBtn">
    Scan Current Website
  </button>

  <div id="result" class="result" style="display:none;">

    <div class="label">Threat Level</div>
    <h3 id="level"></h3>

    <div class="label">Risk Score</div>
    <p id="score"></p>

    <div class="label">Explanation</div>
    <p id="explanation"></p>

  </div>

  <script src="popup.js"></script>

</body>
</html>
