<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REDDFLAGG</title>

<link
  rel="icon"
  type="image/png"
  href="favicon.ico"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#07070a;
  color:white;
  font-family:Arial, sans-serif;
  padding:20px;
}

.container{
  max-width:1100px;
  margin:auto;
}

.brand{
  color:#ff1717;
}

.card{
  background:#12172c;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
  border:1px solid rgba(255,255,255,0.08);
}

textarea{
  width:100%;
  min-height:140px;
  background:#202836;
  border:none;
  color:white;
  padding:15px;
  border-radius:12px;
  resize:none;
  margin-top:15px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  margin-top:15px;
  font-weight:bold;
}

.primary-btn{
  background:#ff1717;
  color:white;
}

.secondary-btn{
  background:#491111;
  color:#ff1717;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-top:20px;
}

.stat-box{
  background:#1e2941;
  padding:18px;
  border-radius:14px;
}

.stat-title{
  opacity:0.7;
  font-size:14px;
}

.stat-value{
  font-size:30px;
  margin-top:8px;
  font-weight:bold;
}

.result{
  margin-top:20px;
}

.result-level{
  font-size:28px;
  font-weight:bold;
}

.high{
  color:#d32444;
}

.suspicious{
  color:#fcc64a;
}

.low{
  color:#2ed46b;
}

.flag{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

.history-item{
  background:#0f172a;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.history-level{
  font-weight:bold;
}

.history-input{
  margin-top:10px;
  word-break:break-word;
}

.history-meta{
  opacity:0.7;
  margin-top:10px;
  font-size:14px;
}

.connection{
  margin-top:10px;
  font-size:14px;
}

.connected{
  color:#4ade80;
}

.offline{
  color:#d32444;
}

.loading{
  opacity:0.7;
  margin-top:10px;
}

.upload-box{
  margin-top:15px;
}

input[type="file"]{
  margin-top:10px;
}

.action-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

</style>
</head>

<body>

<div class="container">

<h1>
<span class="brand">REDD</span>FLAGG
</h1>

<div id="connectionStatus" class="connection">
Checking backend...
</div>

<div class="card">

<h2>Threat Analyzer</h2>

<textarea
id="inputText"
placeholder="Paste suspicious message, email, URL, or phishing text..."
></textarea>

<div class="action-row">

<button
class="primary-btn"
onclick="analyzeText()"
>
Analyze
</button>

<button
class="secondary-btn"
id="refreshBtn"
onclick="refreshAnalytics()"
>
Reset Analytics
</button>

</div>

<div class="upload-box">

<h3 style="margin-top:20px;">
Image Analysis
</h3>

<input
type="file"
id="imageUpload"
accept="image/*"
/>

<button
class="secondary-btn"
onclick="analyzeImage()"
>
Analyze Image
</button>

</div>

<div class="upload-box">

<h3 style="margin-top:20px;">
QR Analysis
</h3>

<input
type="file"
id="qrUpload"
accept="image/*"
/>

<button
class="secondary-btn"
onclick="analyzeQR()"
>
Analyze QR
</button>

</div>

<div id="loading" class="loading"></div>

<div id="result" class="result"></div>

</div>

<div class="card">

<h2>Analytics</h2>

<div class="stats-grid">

<div class="stat-box">
<div class="stat-title">Total Scans</div>
<div class="stat-value" id="totalScans">0</div>
</div>

<div class="stat-box">
<div class="stat-title">High Risk</div>
<div class="stat-value high" id="highRisk">0</div>
</div>

<div class="stat-box">
<div class="stat-title">Suspicious</div>
<div class="stat-value suspicious" id="suspiciousCount">0</div>
</div>

<div class="stat-box">
<div class="stat-title">Low Risk</div>
<div class="stat-value low" id="lowRisk">0</div>
</div>

</div>

</div>

<div class="card">

<h2>Recent Scans</h2>

<div id="history">
<p class="brand">Loading history...</p>
</div>

</div>

</div>

<script>

function getApiBase() {

  const host = window.location.hostname;
  const origin = window.location.origin;

  if (
    host === "127.0.0.1" ||
    host === "localhost"
  ) {
    return "http://127.0.0.1:8000";
  }

  if (
    origin.includes(".app.github.dev")
  ) {
    return origin.replace("-5500", "-8000");
  }

  return "http://127.0.0.1:8000";
}

const API_BASE = getApiBase();

async function safeFetch(url, options = {}) {

  try {

    const response = await fetch(url, options);

    if (!response.ok) {
      throw new Error(
        "Request failed"
      );
    }

    return await response.json();

  } catch (error) {

    console.error(error);

    return null;
  }
}

async function checkBackend() {

  const statusBox =
    document.getElementById(
      "connectionStatus"
    );

  const data =
    await safeFetch(
      API_BASE + "/health"
    );

  if (data) {

    statusBox.innerHTML =
      "Backend Connected";

    statusBox.className =
      "connection connected";

  } else {

    statusBox.innerHTML =
      "Backend Offline";

    statusBox.className =
      "connection offline";
  }
}

function setLoading(text="") {

  document.getElementById(
    "loading"
  ).innerText = text;
}

function renderResult(data) {

  const resultBox =
    document.getElementById(
      "result"
    );

  if (!data) {

    resultBox.innerHTML =
      "<p class='high'>Analysis failed.</p>";

    return;
  }

  let levelClass = "low";

  if (data.level === "HIGH RISK") {
    levelClass = "high";
  }

  else if (
    data.level === "SUSPICIOUS"
  ) {
    levelClass = "suspicious";
  }

  let flagsHtml = "";

  if (data.red_flags) {

    data.red_flags.forEach(flag => {

      flagsHtml +=
        '<div class="flag">' +
        flag +
        '</div>';
    });
  }

  resultBox.innerHTML =

    '<div class="result-level ' +
    levelClass +
    '">' +
    data.level +
    '</div>' +

    '<p style="margin-top:10px;">' +
    'Threat Score: ' +
    data.score +
    '/100' +
    '</p>' +

    '<p style="margin-top:15px;">' +
    data.explanation +
    '</p>' +

    '<h3 style="margin-top:20px;">' +
    'Red Flags' +
    '</h3>' +

    flagsHtml;
}

async function analyzeText() {

  const text =
    document.getElementById(
      "inputText"
    ).value.trim();

  if (!text) {
    alert("Enter some text.");
    return;
  }

  setLoading("Analyzing...");

  const data = await safeFetch(
    API_BASE + "/analyze",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        text:text
      })
    }
  );

  setLoading("");

  renderResult(data);

  await loadStats();
  await loadHistory();
}

async function analyzeImage() {

  const file =
    document.getElementById(
      "imageUpload"
    ).files[0];

  if (!file) {
    alert("Select image.");
    return;
  }

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  setLoading(
    "Scanning image..."
  );

  const data = await safeFetch(
    API_BASE + "/analyze-image",
    {
      method:"POST",
      body:formData
    }
  );

  setLoading("");

  renderResult(data);

  await loadStats();
  await loadHistory();
}

async function analyzeQR() {

  const file =
    document.getElementById(
      "qrUpload"
    ).files[0];

  if (!file) {
    alert("Select QR image.");
    return;
  }

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  setLoading(
    "Scanning QR..."
  );

  const data = await safeFetch(
    API_BASE + "/analyze-qr",
    {
      method:"POST",
      body:formData
    }
  );

  setLoading("");

  renderResult(data);

  await loadStats();
  await loadHistory();
}

async function loadStats() {

  const stats =
    await safeFetch(
      API_BASE + "/stats"
    );

  if (!stats) return;

  document.getElementById(
    "totalScans"
  ).innerText =
    stats.total_scans || 0;

  document.getElementById(
    "highRisk"
  ).innerText =
    stats.high_risk || 0;

  document.getElementById(
    "suspiciousCount"
  ).innerText =
    stats.suspicious || 0;

  document.getElementById(
    "lowRisk"
  ).innerText =
    stats.low_risk || 0;
}

async function loadHistory() {

  const history =
    await safeFetch(
      API_BASE + "/history"
    );

  if (!history) return;

  const historyBox =
    document.getElementById(
      "history"
    );

  historyBox.innerHTML = "";

  if (!history.length) {

    historyBox.innerHTML =
      "<p class='brand'>No scans yet.</p>";

    return;
  }

  history.forEach(item => {

    let levelClass = "low";

    if (item.level === "HIGH RISK") {
      levelClass = "high";
    }

    else if (
      item.level === "SUSPICIOUS"
    ) {
      levelClass = "suspicious";
    }

    const div =
      document.createElement("div");

    div.className =
      "history-item";

    div.innerHTML =

      '<div class="history-top">' +

      '<span class="history-level ' +
      levelClass +
      '">' +
      item.level +
      '</span>' +

      '<span>' +
      item.score +
      '/100</span>' +

      '</div>' +

      '<div class="history-input">' +
      item.input +
      '</div>' +

      '<div class="history-meta">' +
      item.mode +
      ' | ' +
      item.timestamp +
      '</div>' +

      '<p style="margin-top:10px;">' +
      item.explanation +
      '</p>';

    historyBox.appendChild(div);
  });
}

async function refreshAnalytics() {

  const confirmReset =
    confirm(
      "Clear all analytics and history?"
    );

  if (!confirmReset) return;

  try {

    const response =
      await fetch(
        API_BASE + "/history",
        {
          method:"DELETE"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Reset failed"
      );
    }

    await loadStats();
    await loadHistory();

    document.getElementById(
      "result"
    ).innerHTML = "";

    alert(
      "Analytics reset successfully."
    );

  } catch(error) {

    console.error(error);

    alert(
      "Failed to reset analytics."
    );
  }
}

checkBackend();
loadStats();
loadHistory();

</script>

</body>
</html>
