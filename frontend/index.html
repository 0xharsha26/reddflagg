<!DOCTYPE html>
<html>
<head>
  <title>REDDFLAGG</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      padding: 40px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      color: #ff2b2b;
      letter-spacing: 2px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #15151c;
      color: white;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      background: #ff2b2b;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #d91f1f;
    }

    .result {
      margin-top: 25px;
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 16px;
      padding: 22px;
      display: none;
    }

    .score {
      font-size: 32px;
      font-weight: bold;
    }

    .high {
      color: #ff2b2b;
    }

    .suspicious {
      color: #ffb020;
    }

    .low {
      color: #38d66b;
    }

    li {
      margin-bottom: 8px;
    }

    .label {
      color: #aaa;
      font-size: 14px;
      margin-top: 20px;
    }

    .brand {
      color: #777;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>REDDFLAGG</h1>
    <p class="brand">AI-style threat analysis for suspicious emails, links, and messages.</p>

    <textarea id="inputText" placeholder="Paste suspicious email, SMS, or message here..."></textarea>
    <br>
    <button onclick="analyzeThreat()">Analyze Threat</button>

    <div id="result" class="result">
      <div class="label">Threat Level</div>
      <div id="level" class="score"></div>

      <div class="label">Risk Score</div>
      <p id="score"></p>

      <div class="label">Explanation</div>
      <p id="explanation"></p>

      <div class="label">Red Flags</div>
      <ul id="flags"></ul>

      <div class="label">Recommendation</div>
      <p id="recommendation"></p>
    </div>
  </div>

  <script>
    async function analyzeThreat() {
      const text = document.getElementById("inputText").value;

      const response = await fetch("http://127.0.0.1:8000/analyze", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
      });

      const data = await response.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      const resultBox = document.getElementById("result");
      resultBox.style.display = "block";

      const level = document.getElementById("level");
      level.innerText = data.level;

      level.className = "score";

      if (data.level === "HIGH RISK") {
        level.classList.add("high");
      } else if (data.level === "SUSPICIOUS") {
        level.classList.add("suspicious");
      } else {
        level.classList.add("low");
      }

      document.getElementById("score").innerText = data.score + "/100";
      document.getElementById("explanation").innerText = data.explanation;
      document.getElementById("recommendation").innerText = data.recommendation;

      const flagsList = document.getElementById("flags");
      flagsList.innerHTML = "";

      data.red_flags.forEach(flag => {
        const li = document.createElement("li");
        li.innerText = flag;
        flagsList.appendChild(li);
      });
    }
  </script>

</body>
</html>
